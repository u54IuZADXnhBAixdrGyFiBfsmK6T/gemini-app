{% extends "base.html" %}

{% block title %}Alcohol &amp; Hypertrophy - アルコールと筋肥大の真実{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/lifestyle.css') }}">
{% endblock %}

{% block content %}
<div class="lifestyle-detail" id="lifestyle-drinking">
    <!-- コンテンツはJavaScriptで動的に読み込まれます -->
    <div id="content-loading">
        <p>Loading...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import { renderLifestyleContent } from '{{ url_for('static', filename='js/shared/lifestyle_renderer.js') }}';
    
    // JSONデータを読み込んでレンダリング
    fetch('{{ url_for('static', filename='json/lifestyle/drinking.json') }}')
        .then(response => response.json())
        .then(data => {
            renderLifestyleContent(data, 'lifestyle-drinking');
        })
        .catch(error => {
            console.error('コンテンツの読み込みに失敗しました:', error);
            document.getElementById('content-loading').innerHTML = 
                '<p style="color: red;">コンテンツの読み込みに失敗しました。</p>';
        });
</script>
<script type="module" src="{{ url_for('static', filename='js/pages/lifestyle.js') }}"></script>
{% endblock %}
