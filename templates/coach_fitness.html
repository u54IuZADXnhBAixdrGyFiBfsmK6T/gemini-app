{% extends "base.html" %}

{% block title %}AI Fitness Pro{% endblock %}

{% block body_class %}theme-gemini{% endblock %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/coach-layout.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <label for="height">HEIGHT <span>(身長 cm)</span></label>
    <input type="number" id="height" placeholder="例: 170" value="">

    <label for="weight">WEIGHT <span>(体重 kg)</span></label>
    <input type="number" id="weight" placeholder="例: 65" value="">

    <label for="activity">LIFESTYLE <span>(生活習慣)</span></label>
    <textarea id="activity" placeholder="例 : デスクワーク中心で、運動は週末のみ"></textarea>

    <label for="ideal">GOAL <span>(理想の体型)</span></label>
    <textarea id="ideal" placeholder="例 : 筋肉を残しながら、体脂肪を落としたい"></textarea>

    <button id="recommendBtn">GENERATE PLAN</button>

    <div id="output">データの入力を待っています</div>
</div>
{% endblock %}

{% block footer %}
{% endblock %}

{% block scripts %}
{{ super() }}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="{{ url_for('static', filename='js/pages/gemini-fitness.js') }}"></script>
{% endblock %}
